# V17 Phase 2 -- Production target manifest
#
# Single source of truth for "which targets are considered shared/prod."
# Hooks consult this file; nothing else hard-codes prod-target lists.
#
# Maintainer rule: adding a new shared service requires editing this
# file. Hooks fail-closed if a target is unknown -- they still ask for
# verify_action confirmation, but the operator-facing message is
# louder for entries on this explicit list.
#
# Format consumed by:
#   ~/.claude/hooks/verify-infra-target.sh    (Phase 3, target-aware gate)
#   ~/.claude/hooks/block-destructive.sh      (Phase 4, shared-service-yank)
#   ~/.claude/hooks/require-rag-pretooluse.sh (Phase 6, semantic RAG check)

# -----------------------------------------------------------------------------
# Helm releases
# Match shape: helm_release:<release> from target-extract.sh
# -----------------------------------------------------------------------------
prod_helm_releases:
  - { release: rag-mcp,         namespace: rag,        cluster: atlantis }
  - { release: harbor,          namespace: harbor,     cluster: atlantis }
  - { release: dragonfly,       namespace: dragonfly,  cluster: atlantis }
  - { release: bitcoin,         namespace: bitcoin,    cluster: atlantis }
  - { release: postgres-operator, namespace: postgresql, cluster: atlantis }

# -----------------------------------------------------------------------------
# K8s namespaces (per cluster context)
# Match shape: k8s_namespace:<ns> + k8s_context:<ctx>
# Wildcards: trailing '*' = glob match (openshift-* matches openshift-anything)
# -----------------------------------------------------------------------------
prod_k8s_namespaces:
  atlantis:
    # Platform / OpenShift core
    - kube-system
    - openshift-*           # any openshift-system namespace
    - default
    - kube-node-lease
    - kube-public
    - kube-descheduler
    - kube-state-metrics
    # GitOps + CI
    - argocd
    - gitlab-system
    - gitlab-builds
    - harbor
    - k8s-image-puller
    # Auth + identity
    - active-directory
    - bastion
    - keycloak
    - cert-manager
    - mas
    # Databases / state
    - postgresql
    - cnpg-system
    - dragonfly
    - dragonfly-operator-system
    # Apps / surfaces
    - rag
    - cloistr
    - bitcoin
    - home-assistant
    - invoice-ninja
    - kimai
    - firefly
    # Observability + policy
    - grafana
    - loki
    - langfuse
    - external-monitoring
    - monitoring
    - kyverno
  pantheon:
    - "*"                   # everything in pantheon is treated as prod

# -----------------------------------------------------------------------------
# Systemd units (local workstation services that other things depend on)
# Match shape: systemd_unit:<unit>
# -----------------------------------------------------------------------------
prod_systemd_units:
  - rag-event-collector.service
  - rag-sync-processor.service
  - rag-http-daemon.service
  - claude-metrics-shipper.timer
  - ccusage-sync.timer
  - plasmashell-watchdog.timer
  - gdm3.service

# -----------------------------------------------------------------------------
# Docker compose files
# Match shape: docker_compose:<path>
# Implicit rule: compose against ANY file NOT in local_dev_only is prod.
# -----------------------------------------------------------------------------
prod_docker_compose:
  local_dev_only:
    - ~/Development/coldforge-rag-mcp-server/docker-compose.yml

# -----------------------------------------------------------------------------
# SSH hosts (anything that lands on shared infra)
# Match shape: ssh_host:<host>  (matches host, host:port, user@host literally)
# Wildcards: trailing '*' = glob match
# -----------------------------------------------------------------------------
prod_ssh_hosts:
  - postgres                          # peer-auth admin alias
  - postgres-rw.db.aegis-hq.xyz
  - postgres-ro.db.aegis-hq.xyz
  - bastion.aegis-hq.xyz
  - atlantis-*                        # any atlantis node
  - pantheon-*                        # any pantheon node

# -----------------------------------------------------------------------------
# K8s contexts (the cluster the call lands against)
# Match shape: k8s_context:<ctx>
# Implied by aliases like oc-atlantis / oc-pantheon (see target-extract.sh).
# -----------------------------------------------------------------------------
prod_k8s_contexts:
  - atlantis
  - pantheon

# -----------------------------------------------------------------------------
# Atlas roles (Ansible-Atlas: provisioning role names)
# Match shape: atlas_role:<name>
# Convention: anything not in dev_only_roles is prod.
# -----------------------------------------------------------------------------
prod_atlas_roles:
  prod:
    - active_directory
    - ad_management
    - amp
    - bitcoin-node
    - ceph
    - database_dns
    - database_lb
    - db-host-baseline
    - etcd
    - haproxy
    - harbor-k8s
    - harbor-vm
    - host-baseline
    - jump_proxy
    - kolla
    - kube
    - kube/*                          # any kube/<service> sub-role
    - mariadb
    - monitoring
    - mysql
    - nginx_proxy
    - openstack-host-overrides
    - os_images
    - postgres-rotate-rag-mcp
    - postgres
  dev_only:
    # Roles intentionally NOT prod — apply freely without verify_action.
    - dotfiles
    - branding

# -----------------------------------------------------------------------------
# Atlas plays (top-level playbook paths invoked via `atlas-play <path>`)
# Match shape: atlas_play:<path>
# -----------------------------------------------------------------------------
prod_atlas_plays:
  - playbooks/site.yml
  - playbooks/openshift-kubelet-config.yml
  - playbooks/harbor-deploy.yml
  - playbooks/openstack-deploy.yml

# -----------------------------------------------------------------------------
# Ansible plays (raw ansible-playbook invocations, outside the Atlas wrapper)
# Match shape: ansible_play:<path>
# Almost any ansible-playbook against a prod inventory is prod.
# -----------------------------------------------------------------------------
prod_ansible_plays:
  prod_path_globs:
    - "*Atlas*playbooks/*"
    - "*atlas*playbooks/*"

# -----------------------------------------------------------------------------
# File paths (shared/prod paths on the workstation or fanned-out via SSH)
# Match shape: file_path:<path>
# Wildcards: trailing '*' = glob match
# -----------------------------------------------------------------------------
prod_file_paths:
  # System config — touching these can break the workstation
  - /etc/*
  - /var/lib/containers/*
  - /var/log/*
  - /usr/local/bin/*
  - /usr/local/sbin/*
  - /lib/systemd/system/*
  - /etc/systemd/system/*
  - /etc/netplan/*
  - /etc/udev/rules.d/*
  # Operator's identity + secrets — never just mv/chmod these casually
  - ~/.ssh/*
  - ~/.config/rag-mcp/*
  - ~/.arbiter/secrets/*
  - ~/.arbiter/profiles/*
  - ~/.gnupg/*
  - ~/.kube/*
  # Claude harness — operator-shared state
  - ~/.claude/security/*
  - ~/.claude/hooks/*
  - ~/.claude/skills/*
  - ~/.claude/projects/*/memory/*
  - ~/.mcp.json
  # rag-sync working state
  - /var/lib/rag-sync/*

# -----------------------------------------------------------------------------
# Verbs that count as "yanking" a prod target (Phase 4)
# For each tool family, list the subcommands that materially change shared
# state. The change-shape verbs (upgrade, restart, scale, rollout) are here
# alongside the deletion-shape ones because the V17 thesis is that
# CHANGE is operationally indistinguishable from DELETE for shared svcs.
# -----------------------------------------------------------------------------
yank_verbs:
  helm:
    - install
    - upgrade
    - rollback
    - uninstall
    - delete
  kubectl:
    - delete
    - scale
    - drain
    - cordon
    - patch
    - apply
    - replace
    - edit
    - rollout    # rollout restart/undo/pause are all change-shape
  oc:
    - delete
    - scale
    - drain
    - cordon
    - patch
    - apply
    - replace
    - edit
    - rollout
  docker_compose:
    - up
    - down
    - restart
    - stop
    - rm
    - kill
  systemctl:
    - restart
    - stop
    - start
    - reload
    - disable
    - enable
    - mask
    - unmask
  atlas:
    - kube_apply
    - kube_delete
    - playbook
  # File ops emitted by target-extract.sh as file_path:<path> (added 2026-06-17
  # with the V17 Phase 1 file_path extraction). Mutating verbs only; read-only
  # commands (cat/head/tail/less) intentionally do not emit a file_path.
  file:
    - rm
    - mv
    - cp
    - ln
    - chmod
    - chown
    - chgrp
    - touch
    - truncate
    - tee
    - sed              # extractor only emits file_path for `sed -i`
